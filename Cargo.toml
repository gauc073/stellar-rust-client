[package]
name = "stellar-rust-client"
version = "0.3.0-rc.3"
edition = "2024"
description = "Reusable utils for Soroban contract execution: wasm upload, deploy, invoke, read."
license = "MIT"
readme = "README.md"
repository = "https://github.com/gauc073/stellar-rust-client"
homepage = "https://github.com/gauc073/stellar-rust-client"
keywords = ["stellar", "soroban", "blockchain", "smart-contracts"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[dependencies]
soroban-client = "0.5"
stellar-baselib = "0.5.8"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "1"
hex = "0.4"
secrecy = "0.10.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
dotenvy = "0.15.2"
data-security = "0.3.0"
